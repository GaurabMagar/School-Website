<!DOCTYPE html>
<html>


<head>


<title>

</title>

href="css/admin-style.css">


</head>



<body>



<header class="admin-header">


<h1>
Event Management
</h1>


<a href="dashboard.html">

</header>





<div class="notice-admin">


<h2>
Add New Event
</h2>

<div id="eventList">

</div>





<script src="js/admin-script.js"></script>


</body>
